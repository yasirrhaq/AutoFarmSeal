[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autofarmseal"
version = "0.3.3"
description = "A guarded, screen-only Windows farming research prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "mss>=10,<11",
  "PyAutoGUI>=0.9.54,<1; sys_platform == 'win32'",
  "pynput>=1.7.7,<2; sys_platform == 'win32'",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
autofarmseal = "autofarmseal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_ui.py" = ["E402"]
